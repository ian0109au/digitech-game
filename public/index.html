<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JS IO Game Project</title>
<style>
    body {
        margin: 0;
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: sans-serif;
    }
    .game-wrap {
        position: relative;
        width: 800px;
        height: 600px;
    }
    canvas {
        background: #fff;
        border: 2px solid #fff;
        display: block;
    }
    #menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        border: 2px solid #fff;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    #menu.hidden {
        display: none;
    }
    #menu h1 {
        margin: 0 0 24px;
        font-size: 32px;
        letter-spacing: 1px;
    }
    #playBtn {
        padding: 12px 32px;
        font-size: 18px;
        background: #0096ff;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
    #playBtn:hover {
        background: #007fd6;
    }
</style>
</head>
<body>
<div class="game-wrap">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="menu">
        <h1>JS IO Game</h1>
        <button id="playBtn">Play</button>
    </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
