<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>velocify.io</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-wrap">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="menu">
        <div id="serverSelect">
            <h1>Velocify</h1>
            <p class="subtitle">Choose your arena</p>
            <div class="server-list">
                <button class="serverBtn" data-room="server-1">Noob Server</button>
                <button class="serverBtn" data-room="server-2">Intermediate Server</button>
                <button class="serverBtn" data-room="server-3">Pro Server</button>
            </div>
            <button id="quitBtn" class="quitBtn" type="button">Quit</button>
        </div>
        <div id="waitingRoom" class="hidden">
            <h1>Get Ready</h1>
            <p id="countdownText">Game starts in: 30s</p>
            <button id="leaveRoomBtn" class="leaveBtn" type="button">Leave Server</button>
        </div>
    </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
