<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JS IO Game Project</title>
<style>
    body {
        margin: 0;
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: sans-serif;
    }
    .game-wrap {
        position: relative;
        width: 800px;
        height: 600px;
    }
    canvas {
        background: #fff;
        border: 2px solid #fff;
        display: block;
    }
    #menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        border: 2px solid #fff;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .hidden {
        display: none !important;
    }
    #menu h1 {
        margin: 0 0 8px;
        font-size: 32px;
        letter-spacing: 1px;
    }
    #menu .subtitle {
        margin: 0 0 24px;
        opacity: 0.75;
    }
    .server-list {
        display: flex;
        gap: 12px;
    }
    .serverBtn {
        padding: 12px 24px;
        font-size: 16px;
        background: #0096ff;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
    .serverBtn:hover {
        background: #007fd6;
    }
    #countdownText {
        font-size: 20px;
    }
</style>
</head>
<body>
<div class="game-wrap">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="menu">
        <div id="serverSelect">
            <h1>JS IO Game</h1>
            <p class="subtitle">Choose a server</p>
            <div class="server-list">
                <button class="serverBtn" data-room="server-1">Server 1</button>
                <button class="serverBtn" data-room="server-2">Server 2</button>
                <button class="serverBtn" data-room="server-3">Server 3</button>
            </div>
        </div>
        <div id="waitingRoom" class="hidden">
            <h1>Get Ready</h1>
            <p id="countdownText">Game starts in: 30s</p>
        </div>
    </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
