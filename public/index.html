<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JS IO Game Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg: rgb(20, 17, 43);
        --color-panel: rgb(28, 24, 64);
        --color-panel-border: rgb(50, 43, 94);
        --color-text: rgb(244, 241, 251);
        --color-text-muted: rgb(154, 146, 196);
        --color-gold: rgb(255, 190, 61);
        --color-gold-dark: rgb(217, 154, 31);
        --color-teal: rgb(79, 216, 196);
        --color-progress: rgb(255, 159, 91);
        --font-display: 'Bungee', system-ui, sans-serif;
        --font-body: 'Manrope', system-ui, sans-serif;
    }
    body {
        margin: 0;
        background: radial-gradient(circle at 50% 20%, rgb(36, 29, 85) 0%, rgb(20, 17, 43) 55%, rgb(10, 8, 24) 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: var(--font-body);
    }
    .game-wrap {
        position: relative;
        width: 800px;
        height: 600px;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 0 0 1px var(--color-panel-border), 0 30px 60px -25px rgba(0, 0, 0, 0.7);
    }
    canvas {
        background: linear-gradient(180deg, rgb(255, 217, 160) 0%, rgb(255, 158, 203) 35%, rgb(126, 168, 255) 70%, rgb(59, 79, 160) 100%);
        display: block;
    }
    #menu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        background: rgba(20, 17, 43, 0.9);
        backdrop-filter: blur(6px);
        color: var(--color-text);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    .hidden {
        display: none !important;
    }
    #menu h1 {
        font-family: var(--font-display);
        margin: 0 0 8px;
        font-size: 26px;
        color: var(--color-gold);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }
    #menu .subtitle {
        margin: 12px 0 10px;
        color: var(--color-text-muted);
        font-weight: 500;
    }
    .serverBtn {
        font-family: var(--font-body);
        font-weight: 700;
        padding: 12px 26px;
        font-size: 15px;
        color: rgb(36, 26, 5);
        background: var(--color-gold);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 0 var(--color-gold-dark);
        transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    }
    .serverBtn:hover {
        background: rgb(255, 200, 92);
    }
    .serverBtn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--color-gold-dark);
    }
    .serverBtn.small {
        padding: 8px 16px;
        font-size: 13px;
        flex-shrink: 0;
        box-shadow: 0 3px 0 var(--color-gold-dark);
    }
    .serverBtn.small:active {
        box-shadow: 0 1px 0 var(--color-gold-dark);
    }
    .room-list {
        width: 90%;
        max-height: 220px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .room-row {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        text-align: left;
    }
    .room-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        min-width: 0;
    }
    .room-name {
        font-weight: 700;
        font-size: 14px;
        color: var(--color-text);
    }
    .room-meta {
        font-size: 12px;
        color: var(--color-text-muted);
    }
    .room-status {
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        white-space: nowrap;
    }
    .room-status.waiting {
        background: rgba(79, 216, 196, 0.15);
        color: var(--color-teal);
    }
    .room-status.active {
        background: rgba(255, 159, 91, 0.15);
        color: var(--color-progress);
    }
    #countdownText {
        font-family: var(--font-display);
        font-size: 18px;
        color: var(--color-gold);
    }
    .menu-links {
        display: flex;
        gap: 10px;
        margin-top: 16px;
    }
    .option-list {
        width: 90%;
        max-height: 260px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 12px 0;
    }
    .option-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        text-align: left;
    }
    .shop-balance {
        width: 100%;
        margin: 0 0 4px;
        font-family: var(--font-display);
        font-size: 15px;
        color: var(--color-gold);
        text-align: center;
    }
    .empty-state {
        color: var(--color-text-muted);
        font-size: 13px;
        text-align: center;
        margin: 10px 0;
    }
    #moneyHud {
        position: absolute;
        top: 14px;
        right: 14px;
        background: rgba(20, 17, 43, 0.85);
        border: 1px solid rgba(255, 190, 61, 0.4);
        color: var(--color-gold);
        font-family: var(--font-display);
        font-size: 15px;
        padding: 6px 14px;
        border-radius: 999px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        z-index: 5;
    }
    #leaveButton {
        position: absolute;
        left: 14px;
        top: 14px;
        z-index: 6;
    }
</style>
</head>
<body>
<div class="game-wrap">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="menu">
      <div id="serverSelect">
            <h1>JS IO Game</h1>
            <button id="joinButton" class="serverBtn">Quick Join</button>
            <p class="subtitle">or pick a server</p>
            <div id="roomListEl" class="room-list"></div>
            <div class="menu-links">
                <button id="settingsButton" class="serverBtn small">Settings</button>
                <button id="shopButton" class="serverBtn small">Shop</button>
            </div>
      </div>
        <div id="waitingRoom" class="hidden">
            <h1>Get Ready</h1>
            <p id="countdownText">Game starts in: 30s</p>
        </div>
        <div id="settingsPanel" class="hidden">
            <h1>Settings</h1>
            <div id="settingsListEl" class="option-list"></div>
            <button id="settingsBackButton" class="serverBtn small">Back</button>
        </div>
        <div id="shopPanel" class="hidden">
            <h1>Shop</h1>
            <div id="shopListEl" class="option-list"></div>
            <button id="shopBackButton" class="serverBtn small">Back</button>
        </div>
    </div>
    <button id="leaveButton" class="serverBtn small hidden">Leave</button>
    <div id="moneyHud">$0</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="shared/physics.js"></script>
<script src="game.js"></script>
</body>
</html>
